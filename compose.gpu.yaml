# Separation in its own service, on an NVIDIA GPU. Run with:
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build
#
# Open http://localhost:8080. Needs the NVIDIA Container Toolkit on the host.
#
# This is the shape of a deployment that separates on Modal: a web service
# built without torch, and a separator holding the GPU and the weights.
# The api service reaches the separator over the tcp backend for now.

services:
  api:
    build:
      args:
        INSTALL_SEPARATION: "false"
    # compose.yaml's image has torch, and a shared tag would let either build
    # overwrite the other.
    image: the-tuul:web
    environment:
      SEPARATION_BACKEND: tcp
      SEPARATOR_HOST: separator
      SEPARATOR_PORT: 8001
      # The tcp backend names the stems after this setting, and the separator
      # writes them after its own, so both services set it here rather than
      # leaving it to .env.
      SEPARATION_OUTPUT_FORMAT: flac
    volumes: !override
      - job-results:/var/lib/tuul/jobs
    depends_on:
      - separator

  separator:
    image: the-tuul-separator:cuda
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        INSTALL_SEPARATION: "true"
        SEPARATION_DEVICE: cuda
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8001
      DEBUG: "False"
      MAX_REQUESTS: "0"
      SEPARATION_OUTPUT_FORMAT: flac
    command: ["gunicorn", "--config", "gunicorn.conf.py", "api.separator_server:app"]
    volumes:
      - pretrained-models:/app/api/pretrained_models
    ports:
      - "${SEPARATOR_HOST_PORT:-8001}:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
