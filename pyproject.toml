[project]
name = "the_tuul"
version = "1.2.0"
description = "Create a good-enough karaoke track for any song in about 10 minutes"
authors = [{ name = "Dan Kurtz", email = "andfurthermore@gmail.com" }]
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pytubefix>=11.2.0,<12",
    "google-cloud-storage>=3.10.1,<4",
    "fastapi[standard]>=0.136.1,<0.137",
    "gunicorn>=26.0.0,<27",
    "structlog>=25.5.0,<26",
    # Not only audio-separator's: karaoke/separation_progress.py substitutes tqdm to
    # read the inference loop, so it is needed wherever the web tier runs.
    "tqdm>=4.67.1,<5",
]

[dependency-groups]
# Everything torch, for separating and syncing. Optional because a deployment that
# runs both on another host has no use for 3.5 GB of it, and because the web tier
# under the subprocess backends never imports it either.
ml = [
    "audio-separator[cpu]>=0.44.2,<0.45",
    # Held at the minor this tree has separated with. audio-separator 0.44 asks only
    # for >=2.3, which resolves seven releases past anything it was tested against.
    "torch~=2.7.1",
    "torchvision~=0.22.1",
    "torchaudio~=2.7.1",
    "uroman>=1.3.1.1,<2",
]
modal = ["modal>=1.5.5,<2"]
dev = [
    "pytest>=9.0.3,<10",
    "mypy>=2.1.0,<3",
    "ruff>=0.16.7,<0.17",
]

[tool.uv]
package = false

# Only packages naming this index use it, so nothing else moves. Every torch
# package has to name it or the CUDA build returns through another one.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests/api",
]
markers = [
    "network: reaches a live third-party service. Deselected by default, run with `pytest -m network`.",
]
# These tests fail on YouTube's schedule rather than ours, so a red suite would
# stop meaning anything.
addopts = "-m 'not network'"
pythonpath = [
  ".",
  "api"
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: the formatter already wraps code; what is left is long strings and comments.
# B008: FastAPI declares dependencies as argument defaults (File(), Depends()).
ignore = ["E501", "B008"]

[tool.mypy]
