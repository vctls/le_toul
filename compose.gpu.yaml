# Separation and syncing in their own service, on an NVIDIA GPU. Run with:
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build
#
# Open http://localhost:8080. Needs the NVIDIA Container Toolkit on the host.
#
# This is the shape of a deployment that separates on Modal: a web service
# built without torch, and a separator holding the GPU and the weights. The
# api service reaches the separator over the /tasks job protocol, with
# credentials, as it would reach Modal.

services:
  api:
    build:
      args:
        INSTALL_ML: "false"
    # compose.yaml's image has torch, and a shared tag would let either build
    # overwrite the other.
    image: the-tuul:web
    environment:
      SEPARATION_BACKEND: remote
      # Syncing never follows a remote separation, since not every host that separates syncs.
      ALIGNMENT_BACKEND: remote
      SEPARATION_REMOTE_URL: http://separator:8001
      SEPARATION_REMOTE_KEY: ${SEPARATOR_KEY:-wk-local}
      SEPARATION_REMOTE_SECRET: ${SEPARATOR_SECRET:-ws-local}
    volumes: !override
      - job-results:/var/lib/tuul/jobs
    depends_on:
      - separator

  separator:
    image: the-tuul-separator:cuda
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        INSTALL_ML: "true"
        SEPARATION_DEVICE: cuda
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8001
      DEBUG: "False"
      MAX_REQUESTS: "0"
      SEPARATION_OUTPUT_FORMAT: flac
      SEPARATOR_SERVER_KEY: ${SEPARATOR_KEY:-wk-local}
      SEPARATOR_SERVER_SECRET: ${SEPARATOR_SECRET:-ws-local}
    command: ["gunicorn", "--config", "gunicorn.conf.py", "api.separator_server:app"]
    volumes:
      - pretrained-models:/app/api/pretrained_models
    ports:
      - "${SEPARATOR_HOST_PORT:-8001}:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Measures syncing on the GPU against hand-timed projects. Not started by `up`. Run with:
  #   BENCH_PROJECTS=~/path/to/projects docker compose -f compose.yaml -f compose.gpu.yaml \
  #     run --rm bench python scripts/align.py --search /projects
  #
  # The repository is mounted at /repo, so edits apply without a rebuild, and weights
  # land in the host's api/pretrained_models. The projects are mounted read-only.
  bench:
    image: the-tuul-bench:cuda
    build:
      context: .
      dockerfile: Dockerfile.bench
      additional_contexts:
        separator: service:separator
    profiles: ["bench"]
    working_dir: /repo
    # Files written into the repository stay the host user's.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      # librosa's numba cache would otherwise go into the image's venv, which this user can't write.
      NUMBA_CACHE_DIR: /tmp/numba
    volumes:
      - .:/repo
      - ${BENCH_PROJECTS:-./songs}:/projects:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
