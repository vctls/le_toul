[tool.poetry]
name = "the_tuul"
version = "0.17.0"
description = "Create a good-enough karaoke track for any song in about 10 minutes"
authors = ["Dan Kurtz  <andfurthermore@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
audio-separator = {extras = ["cpu"], version = "^0.44.2"}
pytubefix = "^10.7.2"
google-cloud-storage = "^3.10.1"
fastapi = {extras = ["standard"], version = "^0.136.1"}
gunicorn = "^26.0.0"
structlog = "^25.5.0"

[tool.poetry.scripts]
separator-daemon = "api.run_separator_daemon:main"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
mypy = "^2.1.0"
ruff = "^0.16.7"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests/api",
]
pythonpath = [
  ".",
  "api"
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: the formatter already wraps code; what is left is long strings and comments.
# B008: FastAPI declares dependencies as argument defaults (File(), Depends()).
ignore = ["E501", "B008"]

[tool.mypy]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
