# Production-shaped stack: one container serving the built frontend and the API.
# Run with:
#   docker compose up --build
#
# Open http://localhost:8080. No Vite, no hot reload, no test tooling.
# The frontend is compiled into the image at build time.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # This container serves the frontend, so API calls are same-origin.
        # A non-empty value is baked into the bundle as a prefix on /separate_track.
        TUUL_API_HOSTNAME: ""
        TUUL_DONATE_URL: ${TUUL_DONATE_URL:-https://ko-fi.com/incidentist}
    image: the-tuul:latest
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      # DEBUG also decides whether the page loads the built bundle or points at a
      # Vite dev server (api/vite_assets.py), so it cannot be left to .env here.
      DEBUG: "False"
      WORKER_COUNT: ${WORKER_COUNT:-1}
      # Separations run as background tasks in the worker, and a worker recycled
      # by max_requests mid-job takes the job with it while the client polls on.
      MAX_REQUESTS: "0"
      LOCAL_JOB_DIR: /var/lib/tuul/jobs
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - job-results:/var/lib/tuul/jobs
      - pretrained-models:/app/api/pretrained_models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  # Separated tracks, keyed by song hash.
  # Re-separating a song already done is then instant instead of another full run.
  job-results:
  # Model weights, downloaded on first use and not shipped in the image.
  pretrained-models:
